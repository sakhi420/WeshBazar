# Development Docker Compose — PostgreSQL only.
#
# The marketplace backend intentionally does not introduce Redis/Kafka/etc.
# See docs/architecture.md (ADR-005: no Redis initially).

services:
  postgres:
    image: postgres:17-alpine
    container_name: weshbazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weshbazar_dev
    ports:
      - '5432:5432'
    volumes:
      - weshbazar-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d weshbazar_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  weshbazar-postgres-data:
