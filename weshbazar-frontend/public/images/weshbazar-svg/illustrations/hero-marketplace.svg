<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" fill="none" role="img" aria-labelledby="title desc">
<title id="title">تصویر برداری فروشگاه آنلاین ویش‌بازار</title><desc id="desc">Original transparent vector artwork for WeshBazar marketplace.</desc>
<defs>
    <linearGradient id="h_teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38D6C5"/><stop offset=".48" stop-color="#20B8AA"/><stop offset="1" stop-color="#064E4A"/></linearGradient>
    <linearGradient id="h_tealDark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#127F77"/><stop offset="1" stop-color="#064B47"/></linearGradient>
    <linearGradient id="h_gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFD86A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#E87900"/></linearGradient>
    <linearGradient id="h_screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9FAF8"/></linearGradient>
    <linearGradient id="h_mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9FBF8"/><stop offset="1" stop-color="#BDEFE8"/></linearGradient>
    <linearGradient id="h_navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243B4E"/><stop offset="1" stop-color="#0B2430"/></linearGradient>
    <linearGradient id="h_skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7C6A0"/><stop offset="1" stop-color="#D98B65"/></linearGradient>
    <filter id="h_shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="h_soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    
<linearGradient id="h_mount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D8F4F5"/><stop offset="1" stop-color="#B2E0E3"/></linearGradient>
<linearGradient id="h_city" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#76C6C0"/><stop offset="1" stop-color="#277C78"/></linearGradient>
</defs>

<!-- soft ambient glows only; no opaque canvas -->
<ellipse cx="430" cy="495" rx="350" ry="80" fill="#8FE4D8" opacity=".18" filter="url(#h_soft)"/>
<!-- mountain silhouettes -->
<path d="M20 326 118 211l49 56 112-141 93 112 91-91 111 116 84-77 146 140-27 81H37Z" fill="url(#h_mount)" opacity=".72"/>
<path d="m119 211 48 56 52-66-24 7-25-16-18 24-18-5Zm160-85 43 58 50-44-28 6-19-14-18 16-15-22Z" fill="#F7FFFF" opacity=".9"/>
<path d="m463 147 38 44 48-31-23 8-17-12-19 10-14-19Z" fill="#F7FFFF" opacity=".85"/>
<!-- Afghan-inspired city silhouette -->
<g opacity=".9">
 <path d="M0 437h650v74H0Z" fill="#7ECFC3" opacity=".16"/>
 <path d="M20 432v-90h28v90m8 0V365h33v67m14 0v-112h29v112m18 0v-77h44v77m17 0V350h35v82m18 0v-61h46v61m22 0v-97h32v97m18 0v-68h31v68m22 0V365h45v67m18 0v-86h31v86m20 0v-62h39v62" fill="url(#h_city)" opacity=".55"/>
 <g fill="#E9FAF6" opacity=".9"><path d="M104 320v-39q0-23 15-23t15 23v39Z"/><path d="M111 278q8-24 16 0Z"/><path d="M29 340v-42q0-21 9-21t9 21v42Z"/><path d="M31 298q7-19 14 0Z"/></g>
 <!-- landmark dome -->
 <path d="M176 432v-111h14v-34q0-54 53-76 53 22 53 76v34h14v111Z" fill="#198D91"/>
 <path d="M194 321q0-49 49-76 49 27 49 76Z" fill="#24B7B4"/>
 <path d="M243 245v-20m-7 0 7-12 7 12" stroke="#E8B85D" stroke-width="4" stroke-linecap="round"/>
 <path d="M208 350h70M208 375h70M208 401h70" stroke="#D9F5EE" stroke-width="4" opacity=".85"/>
 <path d="M232 432v-55q11-25 22 0v55" fill="#D9F5EE" opacity=".85"/>
 <path d="M174 322h-12v-20q6-18 12 0Zm135 0h-12v-20q6-18 12 0Z" fill="#E5BD68"/>
</g>
<!-- foreground rolling landscape -->
<path d="M0 474q115-61 220-10t206-4q110-56 209-9t165-4v88H0Z" fill="#2CA68E" opacity=".3"/>
<path d="M0 490q100-48 190 1t180-2q104-42 190 0t230-5v70H0Z" fill="#167D69" opacity=".38"/>
<g fill="#168D6D" opacity=".65"><ellipse cx="58" cy="444" rx="16" ry="33"/><ellipse cx="78" cy="450" rx="19" ry="36"/><ellipse cx="98" cy="445" rx="16" ry="30"/><ellipse cx="616" cy="452" rx="18" ry="32"/><ellipse cx="637" cy="459" rx="20" ry="34"/></g>
<!-- phone shadow -->
<ellipse cx="365" cy="530" rx="150" ry="34" fill="#0B615D" opacity=".2" filter="url(#h_soft)"/>
<!-- large shopping phone -->
<g transform="translate(235 80) rotate(-10 140 210)" filter="url(#h_shadow)">
 <rect x="5" y="0" width="284" height="450" rx="43" fill="url(#h_navy)"/>
 <rect x="14" y="9" width="266" height="432" rx="37" fill="#172B35"/>
 <rect x="24" y="20" width="246" height="410" rx="30" fill="url(#h_screen)"/>
 <rect x="110" y="28" width="74" height="9" rx="5" fill="#152D35"/>
 <circle cx="193" cy="32" r="4" fill="#4B7375"/>
 <!-- tiny brand mark -->
 <path d="m112 73 12-20 13 20-11 18Zm25 0 13-20 13 20-13 18Z" fill="url(#h_gold)"/>
 <path d="m107 73 12-20 13 20-12 18Z" fill="url(#h_teal)"/>
 <rect x="45" y="105" width="203" height="42" rx="14" fill="#FFFFFF" stroke="#CBE8E5" stroke-width="2"/>
 <circle cx="65" cy="126" r="8" stroke="#0F8F8D" stroke-width="3"/><path d="m71 132 7 7" stroke="#0F8F8D" stroke-width="3" stroke-linecap="round"/>
 <path d="M92 126h112" stroke="#B8CED1" stroke-width="5" stroke-linecap="round"/>
 <!-- product cards -->
 <g>
  <rect x="43" y="163" width="94" height="105" rx="13" fill="#FFFFFF" stroke="#D7E9E8" stroke-width="2"/>
  <rect x="151" y="163" width="94" height="105" rx="13" fill="#FFFFFF" stroke="#D7E9E8" stroke-width="2"/>
  <rect x="43" y="281" width="94" height="105" rx="13" fill="#FFFFFF" stroke="#D7E9E8" stroke-width="2"/>
  <rect x="151" y="281" width="94" height="105" rx="13" fill="#FFFFFF" stroke="#D7E9E8" stroke-width="2"/>
  <!-- phone product -->
  <rect x="72" y="180" width="37" height="65" rx="7" fill="url(#h_navy)"/><rect x="76" y="186" width="29" height="49" rx="4" fill="#4CCFC5"/><circle cx="91" cy="240" r="2" fill="#D9F6F1"/>
  <!-- headphones -->
  <path d="M172 218v-10q0-22 25-22t25 22v10" stroke="#263D4C" stroke-width="8" stroke-linecap="round"/><rect x="168" y="208" width="14" height="31" rx="7" fill="#263D4C"/><rect x="211" y="208" width="14" height="31" rx="7" fill="#263D4C"/>
  <!-- chair -->
  <path d="M76 301h30v32H76Z" fill="url(#h_gold)"/><path d="M79 299q-5-12 3-15h27q8 7 2 17" fill="#FFBD45"/><path d="M82 333v12m21-12v12m-30 1h38" stroke="#B76B14" stroke-width="5" stroke-linecap="round"/>
  <!-- shoe -->
  <path d="M166 344q17-5 30-27l14 17q10 10 23 14 6 3 3 11h-69q-11-1-8-15Z" fill="#E8EEF0" stroke="#8EA6AE" stroke-width="2"/><path d="M168 358h68" stroke="#5E7E83" stroke-width="3" stroke-linecap="round"/>
 </g>
 <rect x="111" y="407" width="72" height="5" rx="3" fill="#9AAEB1"/>
</g>
<!-- orbital golden ribbon behind phone lower area -->
<path d="M107 463q104-78 252-39 140 38 229-40 46-40 83-15-54 12-75 60-82 107-232 74-123-26-257 20-63 21-91-4 37-9 91-56Z" fill="url(#h_gold)" opacity=".97"/>
<path d="M105 463q117-69 252-33 124 34 232-39" stroke="#FFE38B" stroke-width="8" stroke-linecap="round" opacity=".9"/>
<!-- floating shopping cart tile -->
<g transform="translate(522 111) rotate(7)" filter="url(#h_shadow)"><rect width="112" height="108" rx="25" fill="#FFFFFF"/><path d="M25 31h12l10 46h43l12-34H42" stroke="url(#h_teal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="55" cy="89" r="6" fill="#0F766E"/><circle cx="87" cy="89" r="6" fill="#0F766E"/><path d="M54 44v20m16-20v20m16-20v20" stroke="#24B7AA" stroke-width="5" stroke-linecap="round"/></g>
<!-- floating handshake tile -->
<g transform="translate(586 250) rotate(8)" filter="url(#h_shadow)"><rect width="110" height="100" rx="24" fill="#FFFFFF"/><path d="m24 49 20-17 20 9 11-7 18 15-24 22-14-10-13 9-18-21Z" fill="#B8EEE6"/><path d="m25 47 18-15 19 9 12-6 17 14-22 21-14-10-13 9-17-22Z" fill="url(#h_teal)"/><path d="m52 53 11 10m-1-17 13 11m-2-17 12 8" stroke="#E8FFFA" stroke-width="5" stroke-linecap="round"/></g>
<!-- floating tag tile -->
<g transform="translate(110 335) rotate(-8)" filter="url(#h_shadow)"><rect width="92" height="88" rx="22" fill="#FFFFFF"/><path d="m23 31 39-8 13 32-27 24-27-25Z" fill="url(#h_gold)"/><circle cx="62" cy="35" r="5" fill="#FFF2C8"/></g>
<!-- floating shield tile -->
<g transform="translate(557 375) rotate(7)" filter="url(#h_shadow)"><rect width="96" height="92" rx="22" fill="#FFFFFF"/><path d="M48 15 76 26v21q0 20-28 32Q20 67 20 47V26Z" fill="url(#h_teal)"/><path d="m34 47 10 10 20-22" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g>

</svg>