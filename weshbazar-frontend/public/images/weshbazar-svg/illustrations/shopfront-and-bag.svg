<svg xmlns="http://www.w3.org/2000/svg" width="450" height="330" viewBox="0 0 450 330" fill="none" role="img" aria-labelledby="title desc">
<title id="title">تصویر فروشگاه و کیف خرید</title><desc id="desc">Original transparent vector artwork for WeshBazar marketplace.</desc>
<defs>
    <linearGradient id="bs_teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38D6C5"/><stop offset=".48" stop-color="#20B8AA"/><stop offset="1" stop-color="#064E4A"/></linearGradient>
    <linearGradient id="bs_tealDark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#127F77"/><stop offset="1" stop-color="#064B47"/></linearGradient>
    <linearGradient id="bs_gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFD86A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#E87900"/></linearGradient>
    <linearGradient id="bs_screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9FAF8"/></linearGradient>
    <linearGradient id="bs_mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9FBF8"/><stop offset="1" stop-color="#BDEFE8"/></linearGradient>
