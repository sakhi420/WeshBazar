<svg xmlns="http://www.w3.org/2000/svg" width="520" height="410" viewBox="0 0 520 410" fill="none" role="img" aria-labelledby="title desc">
<title id="title">تصویر سپر اعتماد و امنیت</title><desc id="desc">Original transparent vector artwork for WeshBazar marketplace.</desc>
<defs>
    <linearGradient id="t_teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38D6C5"/><stop offset=".48" stop-color="#20B8AA"/><stop offset="1" stop-color="#064E4A"/></linearGradient>
    <linearGradient id="t_tealDark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#127F77"/><stop offset="1" stop-color="#064B47"/></linearGradient>
    <linearGradient id="t_gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFD86A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#E87900"/></linearGradient>
    <linearGradient id="t_screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9FAF8"/></linearGradient>
    <linearGradient id="t_mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9FBF8"/><stop offset="1" stop-color="#BDEFE8"/></linearGradient>
    <linearGradient id="t_navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243B4E"/><stop offset="1" stop-color="#0B2430"/></linearGradient>
    <linearGradient id="t_skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7C6A0"/><stop offset="1" stop-color="#D98B65"/></linearGradient>
    <filter id="t_shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="t_soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <linearGradient id="t_shield" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42D9C6"/><stop offset=".5" stop-color="#0FA89B"/><stop offset="1" stop-color="#075E58"/></linearGradient></defs>

<ellipse cx="285" cy="365" rx="230" ry="30" fill="#0D8278" opacity=".10" filter="url(#t_soft)"/>
