 <path d="M265 36 407 91v104q0 125-142 205Q123 320 123 195V91Z" fill="#0A655E" opacity=".17" transform="translate(12 12)"/>
 <path d="M265 25 402 78v111q0 120-137 195Q128 309 128 189V78Z" fill="url(#t_shield)" stroke="#075C56" stroke-width="8"/>
