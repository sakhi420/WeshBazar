 <path d="M265 72 353 107v78q0 77-88 130-88-53-88-130v-78Z" fill="#0C8B80" opacity=".58"/>
 <path d="m207 202 39 39 78-88" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<!-- gold orbit -->
<path d="M82 211q54-98 197-93 137 4 213 81 26 27-3 46-32 20-63 3 31 2 31-15-74-73-174-68-113 7-162 67-38 47-88 22-27-14-12-43 18-34 61-45Z" fill="url(#t_gold)" opacity=".97"/>
<path d="M80 211q58-97 199-91 133 7 208 80" stroke="#FFE6A0" stroke-width="7" stroke-linecap="round" opacity=".85"/>
<!-- check badge -->
