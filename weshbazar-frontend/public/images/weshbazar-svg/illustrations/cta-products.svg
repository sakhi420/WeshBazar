<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" fill="none" role="img" aria-labelledby="title desc">
<title id="title">مجموعهٔ کالاهای فروشگاهی برای بنر ویش‌بازار</title><desc id="desc">Original transparent vector artwork for WeshBazar marketplace.</desc>
<defs>
    <linearGradient id="c_teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38D6C5"/><stop offset=".48" stop-color="#20B8AA"/><stop offset="1" stop-color="#064E4A"/></linearGradient>
    <linearGradient id="c_tealDark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#127F77"/><stop offset="1" stop-color="#064B47"/></linearGradient>
    <linearGradient id="c_gold" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#FFD86A"/><stop offset=".5" stop-color="#F59E0B"/><stop offset="1" stop-color="#E87900"/></linearGradient>
    <linearGradient id="c_screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9FAF8"/></linearGradient>
    <linearGradient id="c_mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E9FBF8"/><stop offset="1" stop-color="#BDEFE8"/></linearGradient>
    <linearGradient id="c_navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#243B4E"/><stop offset="1" stop-color="#0B2430"/></linearGradient>
    <linearGradient id="c_skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7C6A0"/><stop offset="1" stop-color="#D98B65"/></linearGradient>
    <filter id="c_shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="12"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="c_soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    </defs>

<ellipse cx="360" cy="352" rx="300" ry="24" fill="#063F3C" opacity=".13" filter="url(#c_soft)"/>
