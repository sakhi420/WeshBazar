name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: weshbazar-backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://weshbazar:weshbazar@127.0.0.1:5432/weshbazar_test
      SHADOW_DATABASE_URL: postgresql://weshbazar:weshbazar@127.0.0.1:5432/weshbazar_shadow
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: weshbazar-backend/.nvmrc
          cache: npm
          cache-dependency-path: weshbazar-backend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Prepare PostgreSQL (role, databases, pg_trgm)
        env:
          PGPASSWORD: postgres
          PGSUPER: postgres
        run: bash scripts/setup-local-db.sh

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: E2E tests
        run: npm run test:e2e

      - name: Security tests
        run: npm run test:security

      - name: Build
        run: npm run build

  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: weshbazar-frontend

    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3000
      API_SERVER_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: weshbazar-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test -- --runInBand

      - name: Production build
        run: npm run build
